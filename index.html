<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker • Login</title>

  <link rel="stylesheet" href="style.css?v=501">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
</head>

<body class="login-body">

  <div class="bg-4k"></div>
  <div class="bg-overlay"></div>
  <div class="animated-overlay"></div>

  <main class="login-wrap">
    <section class="login-card glass">

      <div class="login-brand">
        <h1 class="login-title">Expense Tracker</h1>
        <p class="login-subtitle">Cloud Powered Fintech Dashboard</p>
      </div>

      <!-- Mode pill (Login/Signup indicator) -->
      <div class="mode-pill" id="modePill">
        <span class="mode-dot" id="modeDot"></span>
        <span id="modeLabel">Login Mode</span>
      </div>

      <form id="loginForm" class="login-form" autocomplete="on">

        <div class="field">
          <label>Email</label>
          <input id="email" type="email" required placeholder="e.g., yourname@gmail.com" autocomplete="email" />
        </div>

        <div class="field">
          <label>Password</label>
          <div class="pw-wrap">
            <input id="password" type="password" required minlength="6" placeholder="Minimum 6 characters" autocomplete="current-password" />
            <span id="togglePassword" class="eye-btn" title="Show/Hide">👁</span>
          </div>
        </div>

        <div class="field" id="confirmField" style="display:none;">
          <label>Confirm Password</label>
          <div class="pw-wrap">
            <input id="confirmPassword" type="password" placeholder="Re-enter password" autocomplete="new-password" />
            <span id="toggleConfirm" class="eye-btn" title="Show/Hide">👁</span>
          </div>
        </div>

        <button id="mainBtn" type="button" class="btn btn-primary btn-large">
          Login
        </button>

        <!-- Small links row -->
        <div class="mini-links">
          <a href="#" id="forgotPassword" class="link-btn">Forgot password?</a>

          <span>
            <span id="switchText">New user?</span>
            <a href="#" id="switchMode" class="link-btn">Create account</a>
          </span>
        </div>

        <button id="googleBtn" type="button" class="btn btn-secondary btn-large" style="margin-top:12px;">
          Continue with Google
        </button>

        <div class="notice">Tip: Use Google for fastest login ✨</div>

        <p id="loginError" class="login-error"></p>

      </form>
    </section>
  </main>

  <script type="module" src="auth.js?v=501"></script>

</body>
</html>
