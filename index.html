<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker • Login</title>

  <link rel="stylesheet" href="style.css?v=200">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
</head>

<body class="login-body">

  <div class="bg-4k"></div>
  <div class="bg-overlay"></div>
  <div class="animated-overlay"></div>

  <main class="login-wrap">
    <section class="login-card glass">

      <div class="login-brand">
        <h1 class="login-title">Expense Tracker</h1>
        <p class="login-subtitle">Cloud Powered Fintech Dashboard</p>
      </div>

      <!-- Mode toggle -->
      <div class="auth-toggle">
        <button id="modeLogin" class="auth-pill active" type="button">Login</button>
        <button id="modeSignup" class="auth-pill" type="button">Sign up</button>
      </div>

      <form id="loginForm" class="login-form">
        <!-- Signup only -->
        <div class="field auth-only-signup hidden" id="nameWrap">
          <label>Full Name</label>
          <input id="fullName" type="text" placeholder="e.g., Kavinkumar" />
        </div>

        <div class="field">
          <label>Email</label>
          <input id="email" type="email" placeholder="e.g., name@gmail.com" required />
        </div>

        <div class="field">
          <label>Password</label>
          <input id="password" type="password" minlength="6" placeholder="Minimum 6 characters" required />
        </div>

        <!-- Signup only -->
        <div class="field auth-only-signup hidden" id="confirmWrap">
          <label>Confirm Password</label>
          <input id="confirmPassword" type="password" minlength="6" placeholder="Re-enter password" />
        </div>

        <div class="login-actions">
          <button id="primaryBtn" class="btn btn-primary btn-large" type="button">
            <span class="btn-icon">→</span> Login
          </button>

          <button id="googleBtn" class="btn btn-secondary btn-large" type="button">
            <span class="btn-icon">G</span> Continue with Google
          </button>
        </div>

        <p id="loginHint" class="login-hint">Use your email & password to login.</p>
        <p id="loginError" class="login-error"></p>
      </form>

    </section>
  </main>

  <script type="module" src="app.js?v=901"></script>
</body>
</html>
