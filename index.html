<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker • Login</title>

  <link rel="stylesheet" href="style.css?v=300">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
</head>

<body class="login-body">

  <div class="bg-4k"></div>
  <div class="bg-overlay"></div>
  <div class="animated-overlay"></div>

  <main class="login-wrap">
    <section class="login-card glass">

      <div class="login-brand">
        <h1 class="login-title">Expense Tracker</h1>
        <p class="login-subtitle">Cloud Powered Fintech Dashboard</p>
      </div>

      <form id="loginForm" class="login-form">

        <div class="field">
          <label>Email</label>
          <input id="email" type="email" required placeholder="e.g., yourname@gmail.com">
        </div>

        <div class="field">
          <label>Password</label>
          <input id="password" type="password" required minlength="6" placeholder="Minimum 6 characters">
        </div>

        <div class="field">
          <label>Confirm Password (Sign Up only)</label>
          <input id="confirmPassword" type="password" placeholder="Re-enter password">
        </div>

        <div class="login-actions">
          <button id="loginBtn" type="button" class="btn btn-primary btn-large">
            → Login
          </button>

          <button id="signupBtn" type="button" class="btn btn-secondary btn-large">
            + Create Account
          </button>

          <button id="googleBtn" type="button" class="btn btn-secondary btn-large">
            G Continue with Google
          </button>
        </div>

        <p id="loginError" class="login-error"></p>

      </form>
    </section>
  </main>

  <script type="module" src="auth.js?v=300"></script>

</body>
</html>
